[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-anchored-memory"
version = "0.2.0"
description = "Quantum Anchored Memory (QAM): Loschmidt Echo state verification on IBM Heron QPUs + D0-D8 Merkle hierarchy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Máté Róbert", email = "materobi86@gmail.com" }
]
dependencies = [
  "qiskit>=1.0.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
qpu = [
  "qiskit-ibm-runtime>=0.30.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
