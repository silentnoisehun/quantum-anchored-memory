name: QAM CI

on:
  push:
    branches: [master, main, "arena/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    name: "Python Audit, Hygiene & Statevector Suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Repository hygiene & secret gate"
        run: python scripts/check_hygiene.py

      - name: "Verify committed IBM Heron hardware records"
        run: python verify_results.py

      - name: "Install dependencies"
        run: python -m pip install --upgrade pip pytest qiskit numpy

      - name: "Run pytest suite (simulation clearly labelled)"
        run: pytest -v

  rust:
    name: "Rust Core & Audit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: "Run cargo test"
        run: cargo test --manifest-path rust/Cargo.toml -- --nocapture
